name: build

# Target platform is Minecraft 1.12.2 / Forge 14.23.5.2864, and the toolchain is pinned to JDK 8
# (ForgeGradle 3 does not support JDK 9+).
# Job 1 (L1 compile) is required. Job 2 (L3 headless server smoke) runs in observe mode
# (continue-on-error) for now - it catches the builds-fine-but-crashes-on-server-load class of bug.
# Once it has been green a few times in a row, drop continue-on-error to make it required.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: L1 compile (JDK 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon --stacktrace

  server-smoke:
    name: L3 server smoke (headless)
    runs-on: ubuntu-latest
    needs: compile
    timeout-minutes: 45
    # Watch it for a while first; after a few consecutive green runs, set this to false (or drop the line).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare the dev run directory (eula + fixed settings so runs are comparable)
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'level-type=DEFAULT\nonline-mode=false\nserver-port=25565\n' > run/server.properties

      - name: Start the server (killed on timeout, only the Done marker is judged)
        run: |
          chmod +x gradlew
          timeout 900 ./gradlew runServer --no-daemon > /tmp/server.log 2>&1 || true
          if grep -q 'Done (' /tmp/server.log; then
            echo "::notice ::server started"
            grep -E 'Done \(' /tmp/server.log | tail -1
          else
            echo "::error ::no Done( marker; last 60 log lines follow"
            tail -60 /tmp/server.log
            exit 1
          fi

      - name: Check for crash reports
        if: always()
        run: |
          if [ -d run/crash-reports ] && [ -n "$(ls -A run/crash-reports 2>/dev/null)" ]; then
            echo "::error ::crash report(s) present"
            head -120 run/crash-reports/*.txt
            exit 1
          fi
          echo "no crash reports"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: |
            /tmp/server.log
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
          retention-days: 7
